<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--fg:#16140f;--mute:#6d685d;--accent:#ff4f1a;--line:#e2ded4}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--bg)}
body{font-family:Geist,system-ui,sans-serif;color:var(--fg);position:relative}
.glow{position:absolute;left:50%;top:330px;width:1100px;height:700px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,79,26,.18),rgba(255,79,26,0))}
.top{position:absolute;left:0;right:0;top:42px;display:flex;flex-direction:column;align-items:center;text-align:center}
.row{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:30px;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--fg);color:#fff;font-size:16px;font-weight:500}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:84px;line-height:.95;letter-spacing:-.025em;margin-top:20px}
h1 em{color:var(--accent)}
.shot{position:absolute;left:50%;top:300px;width:740px;transform:translateX(-50%);border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 2px 4px rgba(20,16,8,.06),0 30px 70px -18px rgba(20,16,8,.4);z-index:2}
.shot img{display:block;width:100%}
.card{position:absolute;border-radius:10px;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.1),0 24px 48px -16px rgba(20,16,8,.45);z-index:3}
.card img{display:block;width:100%}
.c1{left:28px;top:360px;width:330px;transform:rotate(-6deg)}
.c2{right:28px;top:380px;width:330px;transform:rotate(5deg)}
</style></head><body>
<div class="glow"></div>
<div class="top">
  <div class="row">
    <div class="brand"><svg width="38" height="38" viewBox="0 0 24 24"><rect x="2" y="6" width="16" height="11" rx="2.5" fill="#ff4f1a" opacity=".35" transform="rotate(-8 10 12)"/><rect x="5" y="7" width="17" height="11" rx="2.5" fill="#ff4f1a"/><rect x="8" y="10.5" width="7" height="1.8" rx=".9" fill="#fff"/><rect x="8" y="13.6" width="10.5" height="1.4" rx=".7" fill="#fff" opacity=".7"/></svg>Deckhand</div>
    <div class="pill"><i></i>Free Gamma alternative</div>
  </div>
  <h1>Type a topic.<br>Get a <em>designed</em> deck.</h1>
</div>
<div class="shot"><img src="editor.png"></div>
<div class="card c1"><img src="cobalt.png"></div>
<div class="card c2"><img src="dusk.png"></div>
</body></html>
